<title>Bundaran ITS WebGL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap">
<style>
/* Layout: full-bleed WebGL stage, floating glass control panel bottom-left, title chip top-left */
:root{
  --ink:#f3f6fb; --ink-dim:#b9c3d3; --glass:rgba(14,22,38,.62); --glass-line:rgba(255,255,255,.16);
  --accent:#ffb347; --accent-ink:#1d1404; --navy:#0b1730;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--navy);color:var(--ink);font-family:var(--body)}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;z-index:5;pointer-events:none}
.title{top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px))}
.title h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(20px,3.2vw,30px);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 14px rgba(0,0,0,.45);text-wrap:balance}
.title p{margin:2px 0 0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);text-shadow:0 1px 8px rgba(0,0,0,.6)}
.panel{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));pointer-events:auto;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border-radius:14px;background:var(--glass);
  border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:calc(100vw - 32px)}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px;gap:3px}
button{font:600 13px/1 var(--body);color:var(--ink);background:transparent;border:0;border-radius:8px;padding:9px 13px;cursor:pointer;letter-spacing:.02em}
button:hover{background:rgba(255,255,255,.1)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.solo{background:rgba(255,255,255,.08)}
.hint{bottom:calc(20px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));font-size:12px;color:var(--ink-dim);text-shadow:0 1px 6px rgba(0,0,0,.7);text-align:right}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--navy);z-index:10;font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;font-size:14px;transition:opacity .6s}
[hidden]{display:none!important}
@media (max-width:560px){.hint{display:none}}
</style>

<canvas id="stage"></canvas>
<div id="loading">Membangun bundaran…</div>
<div class="hud title"><h1>Bundaran ITS</h1><p>Sukolilo · Surabaya</p></div>
<div class="hud panel" role="toolbar" aria-label="Kontrol scene">
  <div class="seg" role="group" aria-label="Waktu">
    <button id="btnDay" aria-pressed="true">Pagi</button>
    <button id="btnNight" aria-pressed="false">Malam</button>
  </div>
  <button id="btnOrbit" class="solo" aria-pressed="true">Orbit 360° aktif</button>
  <button id="btnFountain" class="solo" aria-pressed="true">Air mancur</button>
  <button id="btnReset" class="solo">Reset kamera</button>
</div>
<div class="hud hint">Seret untuk memutar · scroll / cubit untuk zoom</div>

/* ---------- helpers ---------- */
const TAU = Math.PI*2;
const rnd = (a,b)=>a+Math.random()*(b-a);
function canvasTex(w,h,draw,{repeat=null,srgb=true}={}){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); draw(g,w,h);
  const t=new GL3D.CanvasTexture(c);
  if(srgb) t.colorSpace=GL3D.SRGBColorSpace;
  if(repeat){t.wrapS=t.wrapT=GL3D.RepeatWrapping;t.repeat.set(repeat[0],repeat[1]);}
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return t;
}
function noise(g,w,h,amt,alpha=0.08){
  for(let i=0;i<amt;i++){g.fillStyle=Math.random()<.5?`rgba(0,0,0,${alpha})`:`rgba(255,255,255,${alpha})`;g.fillRect(Math.random()*w,Math.random()*h,2,2);}
}
const P = (r,a,y=0)=>new GL3D.Vector3(Math.cos(a)*r, y, Math.sin(a)*r);
// everything that reacts to day/night
const nightables = []; // {mat, day:emissiveIntensity, night:emissiveIntensity}
const glowMeshes = [];  // additive glow sprites/decals -> opacity by night
function nightEmissive(mat, dayI, nightI){ nightables.push({mat,dayI,nightI}); return mat; }

/* ---------- layout constants (metres) ---------- */
const R_ISLAND = 20, R_ROAD_OUT = 36, R_WALK = 41.5, R_PLAZA = 52;
const ROAD_ANGLES = [Math.PI/2, Math.PI, -1.0];   // gerbang, jalan bawah kanopi, jalan diagonal (dipindah)
const LET_CENTER = 0.3;   // posisi tengah tulisan
const GATE_A = Math.PI/2;
const ROAD_W = 16;

/* ---------- sky ---------- */
const skyUni = { top:{value:new GL3D.Color(0x3d7fd1)}, bottom:{value:new GL3D.Color(0xdfeefa)}, horizonGlow:{value:new GL3D.Color(0xfff2d8)} };
const sky = new GL3D.Mesh(new GL3D.SphereGeometry(600,32,16), new GL3D.ShaderMaterial({
  side:GL3D.BackSide, depthWrite:false, fog:false, uniforms:skyUni,
  vertexShader:`varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform vec3 top,bottom,horizonGlow; varying vec3 vP;
    void main(){ float h=clamp(vP.y,0.,1.); vec3 c=mix(bottom,top,pow(h,.55)); c=mix(c,horizonGlow,exp(-h*14.)*.35); gl_FragColor=vec4(c,1.); }`
}));
scene.add(sky);
// clouds (day)
const cloudTex = canvasTex(256,128,(g,w,h)=>{
  for(let i=0;i<14;i++){const x=rnd(50,206),y=rnd(50,80),r=rnd(22,44);
    const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(255,255,255,.85)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);}
});
const clouds = new GL3D.Group();
for(let i=0;i<14;i++){
  const m=new GL3D.Sprite(new GL3D.SpriteMaterial({map:cloudTex,transparent:true,depthWrite:false,fog:false,opacity:.9}));
  const a=rnd(0,TAU), r=rnd(260,380); m.position.set(Math.cos(a)*r, rnd(70,140), Math.sin(a)*r);
  m.scale.set(rnd(120,200), rnd(45,70),1); clouds.add(m);
}
scene.add(clouds);
// stars (night)

for(let i=0;i<1400;i++){const v=new GL3D.Vector3().randomDirection(); if(v.y<0.08) v.y=Math.abs(v.y)+0.08; v.normalize().multiplyScalar(560); sp.push(v.x,v.y,v.z);}
starGeo.setAttribute('position',new GL3D.Float32BufferAttribute(sp,3));
const stars = new GL3D.Points(starGeo,new GL3D.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:false,transparent:true,opacity:0,fog:false,depthWrite:false}));
scene.add(stars);
const moon = new GL3D.Mesh(new GL3D.SphereGeometry(9,24,16), new GL3D.MeshBasicMaterial({color:0xf4f1e0,transparent:true,opacity:0,fog:false}));
moon.position.set(-220,240,-300); scene.add(moon);

/* ---------- ground ---------- */
const grassTex = canvasTex(256,256,(g,w,h)=>{g.fillStyle='#5f8a3a';g.fillRect(0,0,w,h);
  for(let i=0;i<5000;i++){g.fillStyle=`hsla(${rnd(80,105)},${rnd(35,55)}%,${rnd(22,42)}%,.55)`;g.fillRect(Math.random()*w,Math.random()*h,1.5,3);} },{repeat:[60,60]});

/* ---------- plaza (top-down painted texture) ---------- */
const S=4096, SC=S/(2*R_PLAZA); // px per metre
const plazaTex = canvasTex(S,S,(g)=>{
  const cx=S/2, cy=S/2, m=r=>r*SC;
  const ring=(r0,r1,fill)=>{g.beginPath();g.arc(cx,cy,m(r1),0,TAU);g.arc(cx,cy,m(r0),0,TAU,true);g.fillStyle=fill;g.fill();};
  const pt=(r,a)=>[cx+Math.cos(a)*m(r),cy+Math.sin(a)*m(r)];
  // grass everywhere first (letters + gate pillars stand on grass)
  g.fillStyle='#5f8a3a'; g.fillRect(0,0,S,S);
  for(let i=0;i<120000;i++){g.fillStyle=`hsla(${rnd(80,105)},45%,${rnd(24,40)}%,.5)`;g.fillRect(Math.random()*S,Math.random()*S,2,4);}
  // ---- sidewalk: plain grey only ----
  ring(R_ROAD_OUT,R_WALK,'#9a9c9f');
  g.save(); g.strokeStyle='rgba(60,62,66,.25)'; g.lineWidth=1.5;
  for(let r=R_ROAD_OUT+0.5;r<R_WALK;r+=0.5){g.beginPath();g.arc(cx,cy,m(r),0,TAU);g.stroke();}
  const ns=Math.floor(TAU*R_WALK/0.5); for(let k=0;k<ns;k++){const a=k/ns*TAU;g.beginPath();g.moveTo(...pt(R_ROAD_OUT,a));g.lineTo(...pt(R_WALK,a));g.stroke();}
  g.restore();
  ring(R_ROAD_OUT,R_ROAD_OUT+0.45,'#d4d3cf'); ring(R_WALK-0.3,R_WALK,'#c3c2be'); // curbs
  // ---- ring road: patterned paving (grey / beige / red) like the real roundabout ----
  // grey paving base
  ring(R_ISLAND,33,'#8b8d91');
  g.save(); g.beginPath(); g.arc(cx,cy,m(33),0,TAU); g.arc(cx,cy,m(R_ISLAND),0,TAU,true); g.clip();
  // 6 pale-yellow curved triangles (base on the outer edge, apex pulled round to the inner edge);
  // the grey left between them forms the 6 grey triangles
  const rI=19.6, rO=33.4, W6=TAU/6*0.64, T1=0.9, T2=T1-W6;
  const side=(th,T,t)=>pt(rO+(rI-rO)*t, th+T*Math.pow(t,1.35));
  for(let i=0;i<6;i++){
    const th0=i/6*TAU, th1=th0+W6; const n=40;
    g.beginPath(); g.moveTo(...side(th0,T1,0));
    for(let k=1;k<=n;k++) g.lineTo(...side(th0,T1,k/n));      // outer-left corner -> apex
    for(let k=n;k>=0;k--) g.lineTo(...side(th1,T2,k/n));      // apex -> outer-right corner
    g.arc(cx,cy,m(rO),th1,th0,true); g.closePath();
    g.fillStyle='#d8cba2'; g.fill();
  }
  // paving texture
  g.globalAlpha=.08; g.strokeStyle='#2c2a27'; g.lineWidth=1;
  for(let r=R_ISLAND;r<33;r+=0.45){g.beginPath();g.arc(cx,cy,m(r),0,TAU);g.stroke();}
  g.globalAlpha=1; noise(g,S,S,120000,.06); g.restore();
  // light border along the island
  ring(R_ISLAND,R_ISLAND+0.7,'#cfc6b2');
  // red brick band along the outer edge of the carriageway
  ring(33,35.6,'#b24a4c');
  g.save(); g.strokeStyle='rgba(60,15,15,.3)'; g.lineWidth=1.2;
  for(let r=33;r<35.6;r+=0.33){g.beginPath();g.arc(cx,cy,m(r),0,TAU);g.stroke();}
  const nb=Math.floor(TAU*35.6/0.5); for(let k=0;k<nb;k++){const a=k/nb*TAU;g.beginPath();g.moveTo(...pt(33,a));g.lineTo(...pt(35.6,a));g.stroke();}
  g.restore();
  // white markings: centre ring line + radial lines across the road
  g.strokeStyle='#f1efea'; g.lineCap='butt';
  g.lineWidth=m(0.3); g.beginPath(); g.arc(cx,cy,m(26.8),0,TAU); g.stroke();
  g.lineWidth=m(0.28);
  for(let i=0;i<12;i++){const a=i/12*TAU+0.12; g.beginPath(); g.moveTo(...pt(R_ISLAND+0.7,a)); g.lineTo(...pt(33,a)); g.stroke();}
  // ---- approach roads (asphalt) cut through the sidewalk ----
  for(const a of ROAD_ANGLES){
    g.save(); g.translate(cx,cy); g.rotate(a);
    const Rc=35.6, F=6, hw=ROAD_W/2;
    g.fillStyle='#4b4e53'; g.fillRect(m(Rc),-m(hw),m(R_PLAZA),m(2*hw));
    for(const sgn of [-1,1]){
      const yA=sgn*(hw+F), xA=Math.sqrt(Rc*Rc-yA*yA), angA=Math.atan2(yA,xA);
      const B=[Rc+F*0.9, sgn*hw], C=[Rc+0.2, sgn*hw];
      g.beginPath(); g.moveTo(m(Rc),0);
      for(let k=1;k<=16;k++){const an=angA*k/16; g.lineTo(m(Math.cos(an)*Rc),m(Math.sin(an)*Rc));}
      g.quadraticCurveTo(m(C[0]),m(C[1]),m(B[0]),m(B[1])); g.lineTo(m(B[0]),0); g.closePath();
      g.fillStyle='#4b4e53'; g.fill();
      // red band continues round the curved corner and along the road edge
      g.beginPath(); g.moveTo(m(xA),m(yA)); g.quadraticCurveTo(m(C[0]),m(C[1]),m(B[0]),m(B[1])); g.lineTo(m(R_PLAZA),m(sgn*hw));
      g.strokeStyle='#b24a4c'; g.lineWidth=m(1.2); g.stroke();
      g.strokeStyle='#d4d3cf'; g.lineWidth=m(0.25); g.stroke();
    }
    g.fillStyle='#d8d4c9'; g.fillRect(m(43),-m(1),m(R_PLAZA),m(2)); // median
    g.restore();
  }
  noise(g,S,S,50000,.035);
});
const plaza = new GL3D.Mesh(new GL3D.CircleGeometry(R_PLAZA,128), new GL3D.MeshStandardMaterial({map:plazaTex, roughness:.92}));
plaza.rotation.x=-Math.PI/2; plaza.position.y=0.02; plaza.receiveShadow=true; scene.add(plaza);

// approach roads beyond the plaza
const roadTex = canvasTex(256,512,(g,w,h)=>{g.fillStyle='#4b4e53';g.fillRect(0,0,w,h);noise(g,w,h,6000,.07);
  g.fillStyle='#d8d4c9'; g.fillRect(w/2-16,0,32,h); g.fillStyle='#fff';
  for(let y=0;y<h;y+=64){g.fillRect(w*0.25-3,y,6,32);g.fillRect(w*0.75-3,y,6,32);} },{repeat:[1,10]});
for(const a of ROAD_ANGLES){
  const len=260; const road=new GL3D.Mesh(new GL3D.PlaneGeometry(ROAD_W,len), new GL3D.MeshStandardMaterial({map:roadTex,roughness:.95}));
  road.rotation.x=-Math.PI/2; road.rotation.z = -(a - Math.PI/2) ; // plane length runs along local y -> world -z, rotate to angle
  const c=P(R_PLAZA-1+len/2,a,0.03); road.position.copy(c); road.receiveShadow=true;
  // orient: we want plane's long axis radial
  road.rotation.set(-Math.PI/2,0,0); road.rotateOnWorldAxis(new GL3D.Vector3(0,1,0), -a + Math.PI/2);
  scene.add(road);
}

/* ---------- central island ---------- */
const island = new GL3D.Group(); scene.add(island);
const curbTex = canvasTex(512,32,(g,w,h)=>{for(let i=0;i<16;i++){g.fillStyle=i%2?'#1d1d1d':'#f2c418';g.fillRect(i*w/16,0,w/16,h);}},{repeat:[28,1]});
const curb = new GL3D.Mesh(new GL3D.CylinderGeometry(R_ISLAND,R_ISLAND,0.45,128,1,true), new GL3D.MeshStandardMaterial({map:curbTex,roughness:.7}));
curb.position.y=0.22; island.add(curb);
const islandGrassTex = canvasTex(256,256,(g,w,h)=>{g.fillStyle='#6d9a3e';g.fillRect(0,0,w,h);for(let i=0;i<4000;i++){g.fillStyle=`hsla(${rnd(78,100)},50%,${rnd(28,46)}%,.5)`;g.fillRect(Math.random()*w,Math.random()*h,1.5,3);}},{repeat:[10,10]});
const grassMat = new GL3D.MeshStandardMaterial({map:islandGrassTex,roughness:1});
const top = new GL3D.Mesh(new GL3D.CylinderGeometry(R_ISLAND-0.02,R_ISLAND-0.02,0.44,128), grassMat);
top.position.y=0.22; top.receiveShadow=true; island.add(top);
// flower-pattern garden around the fountain (sunflower shape, like the aerial photo)
const gardenTex = canvasTex(2048,2048,(g,w,h)=>{
  const c=w/2, k=w/(2*R_ISLAND); const pt=(r,a)=>[c+Math.cos(a)*r*k,c+Math.sin(a)*r*k];
  g.fillStyle='#6d9a3e'; g.fillRect(0,0,w,h);
  for(let i=0;i<60000;i++){g.fillStyle=`hsla(${rnd(78,100)},50%,${rnd(28,46)}%,.5)`;g.fillRect(Math.random()*w,Math.random()*h,1.5,3);}
  const NP=16;
  // yellow petals pointing outward, with a wide base on the pool edge
  for(let i=0;i<NP;i++){const a=i/NP*TAU, hw=TAU/NP*0.5;
    g.beginPath(); g.moveTo(...pt(9.9,a-hw));
    g.quadraticCurveTo(...pt(13.0,a-hw*1.05),...pt(15.8,a));
    g.quadraticCurveTo(...pt(13.0,a+hw*1.05),...pt(9.9,a+hw)); g.closePath();
    g.fillStyle='#e9cf1c'; g.fill(); g.strokeStyle='#b49a10'; g.lineWidth=4; g.stroke();
    // half circle INSIDE the petal: flat side on the pool edge, bulging outward
    const [bx,by]=pt(9.95,a);
    g.beginPath(); g.arc(bx,by,1.6*k,a-Math.PI/2,a+Math.PI/2); g.closePath();
    const gr=g.createRadialGradient(bx,by,0,bx,by,1.6*k); gr.addColorStop(0,'#6e5a22'); gr.addColorStop(1,'#8f8a34');
    g.fillStyle=gr; g.fill(); g.strokeStyle='#5a4a1c'; g.lineWidth=3; g.stroke();
  }
  // dark hedge band right at the pool edge
  g.beginPath(); g.arc(c,c,9.95*k,0,TAU); g.arc(c,c,9.3*k,0,TAU,true); g.fillStyle='#3d6a2a'; g.fill();
  // pale-yellow round flower clumps in the grass outside the petals
  for(let i=0;i<NP;i++){const a=(i+.5)/NP*TAU; const [x,y]=pt(15.4,a);
    g.beginPath(); g.arc(x,y,0.8*k,0,TAU); g.fillStyle='#ece48a'; g.fill();}
  for(let i=0;i<20000;i++){g.fillStyle='rgba(0,0,0,.06)';g.fillRect(Math.random()*w,Math.random()*h,2,2);}
});
const garden=new GL3D.Mesh(new GL3D.CircleGeometry(R_ISLAND-0.05,128),new GL3D.MeshStandardMaterial({map:gardenTex,roughness:1}));
garden.rotation.x=-Math.PI/2; garden.position.y=0.45; garden.receiveShadow=true; island.add(garden);
// fence
const fenceTex = canvasTex(256,64,(g,w,h)=>{g.clearRect(0,0,w,h);g.fillStyle='#1f2a22';g.fillRect(0,4,w,4);g.fillRect(0,h-10,w,4);for(let x=0;x<w;x+=10)g.fillRect(x,0,3,h);},{repeat:[90,1]});
const fence = new GL3D.Mesh(new GL3D.CylinderGeometry(R_ISLAND-0.4,R_ISLAND-0.4,1.0,128,1,true), new GL3D.MeshStandardMaterial({map:fenceTex,transparent:true,alphaTest:.5,side:GL3D.DoubleSide,roughness:.6,metalness:.3}));
fence.position.y=0.95; island.add(fence);
// low hedge ring at the pool edge
const hedge = new GL3D.Mesh(new GL3D.TorusGeometry(9.7,0.42,8,128), new GL3D.MeshStandardMaterial({color:0x3d6a2a,roughness:1}));
hedge.rotation.x=-Math.PI/2; hedge.position.y=0.6; hedge.castShadow=true; island.add(hedge);

/* ---------- fountain ---------- */
const fountain = new GL3D.Group(); fountain.position.y=0.45; island.add(fountain);
const stoneMat = new GL3D.MeshStandardMaterial({color:0xd9d6cf,roughness:.6});
// flat pool: no column in the middle
const basinWall = new GL3D.Mesh(new GL3D.CylinderGeometry(9.1,9.1,0.5,128,1,true), stoneMat); basinWall.position.y=0.2; fountain.add(basinWall);
const rim = new GL3D.Mesh(new GL3D.TorusGeometry(9.1,0.16,8,128), stoneMat); rim.rotation.x=-Math.PI/2; rim.position.y=0.45; fountain.add(rim);
const waterMat = new GL3D.MeshStandardMaterial({color:0x5aa7b4,roughness:.06,metalness:.25,emissive:0x000000,transparent:true,opacity:.95});
const water = new GL3D.Mesh(new GL3D.CircleGeometry(9.05,128), waterMat); water.rotation.x=-Math.PI/2; water.position.y=0.3; water.receiveShadow=true; fountain.add(water);
// inner green ring inside the pool
const innerRing = new GL3D.Mesh(new GL3D.TorusGeometry(5.9,0.5,8,96), new GL3D.MeshStandardMaterial({color:0x3f7a2c,roughness:1}));
innerRing.rotation.x=-Math.PI/2; innerRing.position.y=0.38; innerRing.scale.z=0.7; fountain.add(innerRing);
// LED nozzle lights: ring on the rim + lines along the jet arms
const ARM_A=[0.35,0.35+Math.PI/2,0.35+Math.PI,0.35+Math.PI*1.5];
const ledPos=[];
for(let i=0;i<64;i++) ledPos.push(P(8.75,i/64*TAU,0.42));
for(const a of ARM_A) for(let j=0;j<7;j++) ledPos.push(P(1.2+j*0.62,a,0.34));
const leds=new GL3D.InstancedMesh(new GL3D.SphereGeometry(0.11,8,6),new GL3D.MeshBasicMaterial({color:0x666666}),ledPos.length);
const _m=new GL3D.Matrix4(); ledPos.forEach((v,i)=>{_m.makeTranslation(v.x,v.y,v.z); leds.setMatrixAt(i,_m); leds.setColorAt(i,new GL3D.Color(1,1,1));});
fountain.add(leds);

// particle water jets (GPU-animated)
const jets=[]; // [ox,oy,oz, vx,vy,vz, life, phase, hue]
const addJet=(o,v,count,life,spread,hue)=>{for(let i=0;i<count;i++){jets.push(o.x,o.y,o.z, v.x+rnd(-spread,spread), v.y+rnd(-spread,spread)*0.6, v.z+rnd(-spread,spread), life*rnd(.85,1.05), Math.random(), hue);}};
for(let i=0;i<7;i++){const o=i?P(0.7,i/6*TAU,0.3):new GL3D.Vector3(0,0.3,0); addJet(o,new GL3D.Vector3(0,i?10.5:13,0),i?200:420,i?2.1:2.6,0.35,0.6);} // centre cluster
ARM_A.forEach((a,ai)=>{for(let j=0;j<7;j++){const r=1.2+j*0.62; addJet(P(r,a,0.3),new GL3D.Vector3(0,9.2-j*0.75,0),85,1.8-j*0.1,0.16,[0.0,0.6,0.33,0.95][ai]);}}); // 4 arms
for(let i=0;i<12;i++){const a=i/12*TAU; addJet(P(7.5,a,0.3),new GL3D.Vector3(0,6.2,0),95,1.3,0.18,i/12);} // outer ring
const JN=jets.length/9;
const jg=new GL3D.BufferGeometry();
const jo=new Float32Array(JN*3), jv=new Float32Array(JN*3), jl=new Float32Array(JN), jp=new Float32Array(JN), jh=new Float32Array(JN);
for(let i=0;i<JN;i++){const b=i*9; jo.set([jets[b],jets[b+1],jets[b+2]],i*3); jv.set([jets[b+3],jets[b+4],jets[b+5]],i*3); jl[i]=jets[b+6]; jp[i]=jets[b+7]; jh[i]=jets[b+8];}
jg.setAttribute('position',new GL3D.BufferAttribute(jo,3)); jg.setAttribute('aVel',new GL3D.BufferAttribute(jv,3));
jg.setAttribute('aLife',new GL3D.BufferAttribute(jl,1)); jg.setAttribute('aPhase',new GL3D.BufferAttribute(jp,1)); jg.setAttribute('aHue',new GL3D.BufferAttribute(jh,1));
const waterUni={uTime:{value:0},uNight:{value:0},uPix:{value:renderer.getPixelRatio()},uOn:{value:1}};
const jetMat=new GL3D.ShaderMaterial({uniforms:waterUni,transparent:true,depthWrite:false,blending:GL3D.AdditiveBlending,
  vertexShader:`uniform float uTime,uPix,uNight,uOn; attribute vec3 aVel; attribute float aLife,aPhase,aHue; varying vec3 vC; varying float vA;

const texCache={};
// builds 3D letters along an arc. outward=true -> letters face away from the roundabout
function buildArcText({radius,center,height,y0,outward,color,sideColor,emissive,nightI,depth,gap,spaceW,layers=LAYERS}){
  const group=new GL3D.Group(); scene.add(group);
  const info=[...TEXT].map(ch=>({ch,w: ch===' '? spaceW : mctx.measureText(ch).width/200*height + gap}));
  const tw=info.reduce((s,l)=>s+l.w,0), sp=tw/radius;
  const dir=outward?-1:1; // inward text reads with increasing angle, outward with decreasing
  const a0=center - dir*sp/2;
  const front=new Map(), side=new Map();
  let acc=0;
  for(const L of info){
    const aMid=a0+dir*(acc+L.w/2)/radius; acc+=L.w;
    if(L.ch===' ') continue;
    let tex=texCache[L.ch];
    if(!tex){ tex=texCache[L.ch]=canvasTex(256,256,(g,w,h)=>{g.clearRect(0,0,w,h);g.fillStyle='#fff';g.font='700 230px Oswald, "Arial Narrow", Impact, sans-serif';g.textAlign='center';g.textBaseline='alphabetic';g.fillText(L.ch,w/2,232);}); }
    if(!front.has(L.ch)){
      const f=new GL3D.MeshStandardMaterial({map:tex,alphaTest:.5,color,roughness:.35,emissive,emissiveMap:tex,emissiveIntensity:0,side:GL3D.DoubleSide});
      const sd=new GL3D.MeshStandardMaterial({map:tex,alphaTest:.5,color:sideColor,roughness:.5,emissive,emissiveMap:tex,emissiveIntensity:0,side:GL3D.DoubleSide});
      nightEmissive(f,0,nightI); nightEmissive(sd,0,nightI*0.33); front.set(L.ch,f); side.set(L.ch,sd);
    }
    const grp=new GL3D.Group(); const geo=new GL3D.PlaneGeometry(height,height);
    for(let k=0;k<layers;k++){const m=new GL3D.Mesh(geo,(k===0||k===layers-1)?front.get(L.ch):side.get(L.ch)); m.position.z=-k*depth/(layers-1); m.castShadow=true; grp.add(m);}
    grp.position.copy(P(radius,aMid,y0+height/2-0.05));
    grp.rotation.y= outward ? Math.atan2(Math.cos(aMid),Math.sin(aMid)) : Math.atan2(-Math.cos(aMid),-Math.sin(aMid));
    group.add(grp);
  }
  return {start:Math.min(a0,a0+dir*sp), span:sp};
}

/* ---------- gear geometry (pola gerigi) ---------- */
function gearShape(rOut,rIn,teeth,hole){
  const s=new GL3D.Shape(); const step=TAU/teeth;
  for(let i=0;i<teeth;i++){const a=i*step;
    const pts=[[rIn,a],[rOut,a+step*.18],[rOut,a+step*.5],[rIn,a+step*.68]];
    pts.forEach(([r,an],j)=>{const x=Math.cos(an)*r,y=Math.sin(an)*r; (i===0&&j===0)?s.moveTo(x,y):s.lineTo(x,y);});
  }
  s.closePath();
  if(hole){const h=new GL3D.Path(); h.absarc(0,0,hole,0,TAU,true); s.holes.push(h);}
  return s;
}
const gearMat=new GL3D.MeshStandardMaterial({color:0xe7e8ea,roughness:.45,metalness:.15});
// gear ring (teeth + big hole) bent around a cylinder of radius R, facing +z
function reliefGear(r,R){
  const geo=new GL3D.ExtrudeGeometry(gearShape(r,r*0.8,10,r*0.62),{depth:0.09,bevelEnabled:true,bevelSize:0.015,bevelThickness:0.015,bevelSegments:1,curveSegments:16});
  geo.rotateZ(Math.random()*TAU);
  const p=geo.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i), z=p.getZ(i), rad=R-0.02+z, th=x/R; p.setXYZ(i,Math.sin(th)*rad,p.getY(i),Math.cos(th)*rad);}
  geo.computeVertexNormals(); return geo;
}

// median island in front of the monument: sculpted topiary hedges with the flags standing among them
const halfW=dz=> dz>0 ? 4.3*Math.sqrt(Math.max(0,1-(dz/4.5)**2)) : 1.1+3.2*Math.pow((19+dz)/19,0.75);
const isl=new GL3D.Shape(); { const pts=[]; for(let k=0;k<=40;k++){const dz=-19+k*(23.5/40); pts.push([halfW(dz),dz]);}
  isl.moveTo(-pts[0][0],pts[0][1]); pts.forEach(([w,dz])=>isl.lineTo(-w,dz)); [...pts].reverse().forEach(([w,dz])=>isl.lineTo(w,dz)); isl.closePath(); }
const islMesh=new GL3D.Mesh(new GL3D.ExtrudeGeometry(isl,{depth:0.3,bevelEnabled:false}),new GL3D.MeshStandardMaterial({color:0x5f8f3a,roughness:1}));
islMesh.rotation.x=Math.PI/2; islMesh.position.set(0,0.32,gateR); islMesh.receiveShadow=true; scene.add(islMesh); // shape y -> world z
// yellow / black curb blocks around the island
{ const outline=isl.getSpacedPoints(110); const cb=new GL3D.InstancedMesh(new GL3D.BoxGeometry(0.62,0.34,0.3),new GL3D.MeshStandardMaterial({roughness:.7}),outline.length-1);
  for(let k=0;k<outline.length-1;k++){const a=outline[k],b=outline[k+1]; const o=new GL3D.Object3D(); o.position.set((a.x+b.x)/2,0.17,gateR+(a.y+b.y)/2); o.rotation.y=-Math.atan2(b.y-a.y,b.x-a.x); o.updateMatrix(); cb.setMatrixAt(k,o.matrix); cb.setColorAt(k,new GL3D.Color(k%2?0x1c1c1c:0xf2c418));}
  scene.add(cb); }
// topiary: rounded, boxy hedge blocks in curving rows
const hedgeTex=canvasTex(128,128,(g,w,h)=>{g.fillStyle='#3f7a2a';g.fillRect(0,0,w,h);for(let i=0;i<2500;i++){g.fillStyle=`hsla(${rnd(85,110)},55%,${rnd(22,42)}%,.8)`;g.fillRect(Math.random()*w,Math.random()*h,3,3);}},{repeat:[2,2]});
const topiaryMat=new GL3D.MeshStandardMaterial({map:hedgeTex,roughness:1});
const hedgeGeo=new GL3D.RoundedBoxGeometry(1,1,1,3,0.28);
const hedgeBlocks=[];
for(let dz=-17.6; dz<=-1.2; dz+=1.55){
  const w=halfW(dz)-0.55, row=Math.round((dz+17.6)/1.55);
  const segs=Math.max(1,Math.round(2*w/2.4)), sw=2*w/segs;
  for(let k=0;k<segs;k++){
    const x=-w+sw*(k+0.5);
    const hgt=((k+row)%2?1.35:0.85)+rnd(-.08,.08);
    hedgeBlocks.push([x, dz, sw*1.02, hgt, 1.6, 0]);
  }
}
const topiary=new GL3D.InstancedMesh(hedgeGeo,topiaryMat,hedgeBlocks.length);
hedgeBlocks.forEach(([x,dz,sx,sy,sz,ry],k)=>{const o=new GL3D.Object3D(); o.position.set(x,0.3+sy/2,gateR+dz); o.scale.set(sx,sy,sz); o.rotation.y=ry; o.updateMatrix(); topiary.setMatrixAt(k,o.matrix);});
topiary.castShadow=true; topiary.receiveShadow=true; scene.add(topiary);
// flags staggered across the hedge garden, ASEAN at the front centre (nearest the roundabout)
const flagSpots=[
  ['ASEAN',0,-17.2,10.5],
  ['Indonesia',-1.5,-14.6,9.6],['Singapura',1.7,-13.6,9.2],
  ['Malaysia',-2.4,-11.6,8.6],['Filipina',2.6,-10.8,9.4],
  ['Thailand',-1.0,-9.0,9.0],['Myanmar',1.2,-7.6,8.4],
  ['Vietnam',-3.3,-7.0,8.0],['Brunei',3.4,-6.0,9.2],
  ['Kamboja',-2.8,-3.6,8.6],['Laos',3.0,-3.4,8.2]
];
flagSpots.forEach(([name,x,dz,h])=>flag(x,gateR+dz,h,FLAGS[name],Math.PI+rnd(-.35,.35)));

/* ---------- street lamps ---------- */
const lampPoleMat=new GL3D.MeshStandardMaterial({color:0x9aa0a8,metalness:.6,roughness:.4});
const bulbMat=new GL3D.MeshStandardMaterial({color:0xfff2d0,emissive:0xffe2a8,emissiveIntensity:0.1}); nightEmissive(bulbMat,0.1,6);
function addGroundGlow(pos,size,color,max){
  const tex=addGroundGlow.tex||(addGroundGlow.tex=canvasTex(128,128,(g,w,h)=>{const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.45,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);}));
  const mat=new GL3D.MeshBasicMaterial({map:tex,color,transparent:true,opacity:0,blending:GL3D.AdditiveBlending,depthWrite:false});
  const m=new GL3D.Mesh(new GL3D.PlaneGeometry(size*2,size*2),mat); m.rotation.x=-Math.PI/2; m.position.set(pos.x,0.08,pos.z); scene.add(m);
  glowMeshes.push({mat,max});
}
function lamp(a,r){
  const base=P(r,a,0); const inward=new GL3D.Vector3(-Math.cos(a),0,-Math.sin(a));
  const pole=new GL3D.Mesh(new GL3D.CylinderGeometry(0.1,0.16,9,8),lampPoleMat); pole.position.set(base.x,4.5,base.z); pole.castShadow=true; scene.add(pole);
  const arm=new GL3D.Mesh(new GL3D.BoxGeometry(0.1,0.1,2.4),lampPoleMat); arm.position.set(base.x+inward.x*1.1,9,base.z+inward.z*1.1); arm.lookAt(base.x+inward.x*5,9,base.z+inward.z*5); scene.add(arm);
  const head=new GL3D.Mesh(new GL3D.BoxGeometry(0.5,0.18,0.9),bulbMat); head.position.set(base.x+inward.x*2.2,8.9,base.z+inward.z*2.2); head.lookAt(base.x+inward.x*5,8.9,base.z+inward.z*5); scene.add(head);
  addGroundGlow(new GL3D.Vector3(base.x+inward.x*3,0,base.z+inward.z*3),7,0xffcf8a,.55);
}
for(let i=0;i<14;i++){const a=i/14*TAU+0.11; if(ROAD_ANGLES.some(r=>Math.abs(Math.atan2(Math.sin(a-r),Math.cos(a-r)))<0.36)) continue; lamp(a,38.6);}
// a few warm night lights to light the plaza
const plazaLights=[];
for(let i=0;i<4;i++){const l=new GL3D.PointLight(0xffc98a,0,70,1.5); l.position.copy(P(30,i/4*TAU+.4,9)); scene.add(l); plazaLights.push(l);}

/* ---------- a few trees (kept sparse) ---------- */
const trunkMat=new GL3D.MeshStandardMaterial({color:0x5a4330,roughness:1});
const leafMats=[0x3f6e2c,0x4f7e33,0x355f27].map(c=>new GL3D.MeshStandardMaterial({color:c,roughness:.95,flatShading:true}));
function tree(x,z,s=1){
  const g=new GL3D.Group(); g.position.set(x,0,z); g.scale.setScalar(s);
  const tr=new GL3D.Mesh(new GL3D.CylinderGeometry(0.25,0.4,4.5,8),trunkMat); tr.position.y=2.25; tr.castShadow=true; g.add(tr);
  for(let i=0;i<5;i++){const f=new GL3D.Mesh(new GL3D.IcosahedronGeometry(rnd(1.6,2.4),1),leafMats[i%3]); f.position.set(rnd(-1.4,1.4),rnd(4.8,6.6),rnd(-1.4,1.4)); f.scale.y=.75; f.castShadow=true; g.add(f);}
  scene.add(g);
}
function palm(x,z,s=1){
  const g=new GL3D.Group(); g.position.set(x,0,z); g.scale.setScalar(s);
  const tr=new GL3D.Mesh(new GL3D.CylinderGeometry(0.22,0.32,7,8),trunkMat); tr.position.y=3.5; tr.castShadow=true; g.add(tr);
  const leafGeo=new GL3D.PlaneGeometry(0.9,4.2,1,4); leafGeo.translate(0,2.1,0);
  const p=leafGeo.attributes.position; for(let i=0;i<p.count;i++){const y=p.getY(i); p.setZ(i,-0.06*y*y);} leafGeo.computeVertexNormals();
  const lm=new GL3D.MeshStandardMaterial({color:0x4d7d2e,side:GL3D.DoubleSide,roughness:.9});
  for(let i=0;i<9;i++){const l=new GL3D.Mesh(leafGeo,lm); l.position.y=7; l.rotation.set(0,i/9*TAU,0); l.rotateX(1.0); l.castShadow=true; g.add(l);}
  scene.add(g);
}
// island: 4 trees placed off-centre so the fountain stays visible
[[0.6,17.6],[1.9,17.4],[3.2,17.7],[4.4,17.5],[5.5,17.6]].forEach(([a,r])=>{const p=P(r,a); tree(p.x,p.z,rnd(.9,1.1));});
// outer: sparse
[[0.9,58],[0.35,63],[3.5,58],[4.05,61],[-0.2,58],[5.9,62],[2.3,66]].forEach(([a,r])=>{const p=P(r,a); tree(p.x,p.z,rnd(1,1.3));});
palm(-ROAD_W/2-1.5,gateR-12,1); palm(ROAD_W/2+1.5,gateR-12,1); palm(-ROAD_W/2-11,gateR+2,1.1); palm(ROAD_W/2+11,gateR+2,1.1);

/* ---------- cars driving clockwise (keep-left, like Indonesia) ---------- */
const carColors=[0xd9dde2,0x1d1f24,0xb4252b,0x2a5fb0,0x8a8f96,0xf0f0f0,0x3a6e4a,0xe0a020,0x5b2a86,0xc8c2b4];
const headMat=new GL3D.MeshStandardMaterial({color:0xffffff,emissive:0xfff3d0,emissiveIntensity:0.2}); nightEmissive(headMat,0.2,8);
const tailMat=new GL3D.MeshStandardMaterial({color:0x880000,emissive:0xff1a1a,emissiveIntensity:0.2}); nightEmissive(tailMat,0.2,5);
const glassMat=new GL3D.MeshStandardMaterial({color:0x1a2633,roughness:.1,metalness:.6});
const wheelMat=new GL3D.MeshStandardMaterial({color:0x151515,roughness:.9});
const cars=[];
function makeCar(color,kind){
  const g=new GL3D.Group(); const body=new GL3D.MeshStandardMaterial({color,roughness:.35,metalness:.55});
  const L=kind==='van'?5.0:4.4, H=kind==='van'?1.5:0.85;
  const b=new GL3D.Mesh(new GL3D.BoxGeometry(1.9,H,L),body); b.position.y=0.45+H/2; b.castShadow=true; g.add(b);
  const cab=new GL3D.Mesh(new GL3D.BoxGeometry(1.7,0.75,kind==='van'?3.6:2.3),glassMat); cab.position.set(0,0.45+H+0.37,kind==='van'?-0.4:-0.25); cab.castShadow=true; g.add(cab);
  const roof=new GL3D.Mesh(new GL3D.BoxGeometry(1.72,0.08,kind==='van'?3.5:2.1),body); roof.position.set(0,cab.position.y+0.4,cab.position.z); g.add(roof);
  for(const sx of [-0.95,0.95]) for(const sz of [-L*0.32,L*0.32]){const w=new GL3D.Mesh(new GL3D.CylinderGeometry(0.38,0.38,0.3,14),wheelMat); w.rotation.z=Math.PI/2; w.position.set(sx,0.38,sz); g.add(w);}
  for(const sx of [-0.62,0.62]){
    const h=new GL3D.Mesh(new GL3D.BoxGeometry(0.42,0.18,0.06),headMat); h.position.set(sx,0.75,L/2+0.01); g.add(h);
    const t=new GL3D.Mesh(new GL3D.BoxGeometry(0.42,0.16,0.06),tailMat); t.position.set(sx,0.8,-L/2-0.01); g.add(t);
  }
  // headlight beam on the road (night only)
  const beamMat=new GL3D.MeshBasicMaterial({map:addGroundGlow.tex,color:0xfff0c8,transparent:true,opacity:0,blending:GL3D.AdditiveBlending,depthWrite:false});
  const beam=new GL3D.Mesh(new GL3D.PlaneGeometry(3.6,7),beamMat); beam.rotation.x=-Math.PI/2; beam.position.set(0,0.06,L/2+3.2); g.add(beam); glowMeshes.push({mat:beamMat,max:.45});
  scene.add(g); return g;
}
const lanes=[{r:23.7,v:0.21,n:6},{r:30.0,v:0.17,n:7}];
let ci=0;
lanes.forEach((ln,li)=>{for(let i=0;i<ln.n;i++){const car=makeCar(carColors[ci%carColors.length], ci%5===3?'van':'car'); ci++;
  cars.push({obj:car,r:ln.r,a:i/ln.n*TAU+li*0.3+rnd(-.12,.12),v:ln.v*rnd(.92,1.08)});}});

/* ---------- day / night ---------- */
const DAY={top:new GL3D.Color(0x3d7fd1),bottom:new GL3D.Color(0xdfeefa),glow:new GL3D.Color(0xfff2d8),fog:new GL3D.Color(0xcfe0ef)};
const NIGHT={top:new GL3D.Color(0x01030a),bottom:new GL3D.Color(0x0a1426),glow:new GL3D.Color(0x182440),fog:new GL3D.Color(0x060b18)};
let nightTarget=0, night=0;
function applyNight(k){
  skyUni.top.value.copy(DAY.top).lerp(NIGHT.top,k);
  skyUni.bottom.value.copy(DAY.bottom).lerp(NIGHT.bottom,k);
  skyUni.horizonGlow.value.copy(DAY.glow).lerp(NIGHT.glow,k);
  scene.fog.color.copy(DAY.fog).lerp(NIGHT.fog,k);
  sun.intensity=2.6*(1-k); sun.castShadow=k<0.6;
  moonLight.intensity=0.35*k;
  hemi.intensity=GL3D.MathUtils.lerp(1.1,0.1,k);
  hemi.color.setHex(k>0.5?0x6c86c0:0xcfe6ff);
  stars.material.opacity=k; moon.material.opacity=k;
  clouds.children.forEach(c=>c.material.opacity=0.9*(1-k));
  nightables.forEach(n=>n.mat.emissiveIntensity=GL3D.MathUtils.lerp(n.dayI,n.nightI,k));
  glowMeshes.forEach(g=>g.mat.opacity=g.max*k);
  plazaLights.forEach(l=>l.intensity=55*k);
  letterLight.intensity=90*k;
  waterUni.uNight.value=k;
  bloom.strength=GL3D.MathUtils.lerp(0.15,0.7,k);
  bloom.threshold=GL3D.MathUtils.lerp(0.95,0.68,k);
  renderer.toneMappingExposure=GL3D.MathUtils.lerp(1.0,1.1,k);
}
applyNight(0);

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
function setMode(n){nightTarget=n; $('btnDay').setAttribute('aria-pressed',String(!n)); $('btnNight').setAttribute('aria-pressed',String(!!n));}
$('btnDay').onclick=()=>setMode(0); $('btnNight').onclick=()=>setMode(1);
$('btnOrbit').onclick=e=>{controls.autoRotate=!controls.autoRotate; e.currentTarget.setAttribute('aria-pressed',String(controls.autoRotate)); e.currentTarget.textContent=controls.autoRotate?'Orbit 360° aktif':'Orbit 360° jeda';};
let fountainOn=1;
$('btnFountain').onclick=e=>{fountainOn=fountainOn?0:1; e.currentTarget.setAttribute('aria-pressed',String(!!fountainOn));};
$('btnReset').onclick=()=>{camera.position.copy(HOME); controls.target.set(0,3,0);};
addEventListener('keydown',e=>{if(e.key==='n'||e.key==='N')setMode(nightTarget?0:1);});
// pause auto-orbit while dragging, resume after
let resumeT=null; controls.addEventListener('start',()=>{clearTimeout(resumeT);});
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduced){controls.autoRotateSpeed=0.2;}

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);});

/* ---------- loop ---------- */
const clock=new GL3D.Clock();
const hsl=new GL3D.Color();
function tick(){
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  night+= (nightTarget-night)*Math.min(1,dt*2.2); applyNight(night);
  waterUni.uTime.value=t;
  waterUni.uOn.value+= (fountainOn-waterUni.uOn.value)*Math.min(1,dt*2);
  // fountain colours
  for(let i=0;i<fLights.length;i++){hsl.setHSL((t*0.07+i/4)%1,1,0.55); fLights[i].color.copy(hsl); fLights[i].intensity=(2+night*22)*waterUni.uOn.value;}
  leds.material.color.setScalar(0.35+night*1.8);
  for(let i=0;i<ledPos.length;i++){hsl.setHSL(i<64?((i/64+t*0.12)%1):((Math.floor((i-64)/7)/4+t*0.07)%1),1,0.55); leds.setColorAt(i,hsl);} leds.instanceColor.needsUpdate=true;
  hsl.setHSL((t*0.07)%1,0.9,0.45); waterMat.emissive.copy(hsl).multiplyScalar(night*0.18*waterUni.uOn.value);
  // cars
  for(const c of cars){ c.a+=c.v*dt*(28/c.r); const p=P(c.r,c.a,0); const n=P(c.r,c.a+0.05,0); c.obj.position.copy(p); c.obj.lookAt(n); }
  // flags
  for(const f of flags){const pa=f.m.geometry.attributes.position; for(let i=0;i<pa.count;i++){const x=f.base[i*3]; pa.setZ(i,Math.sin(x*2.2-t*5+f.ph)*0.18*x/2.6);} pa.needsUpdate=true;}
  emblem.rotation.y=Math.sin(t*0.3)*0.25;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
const ld=$('loading'); ld.style.opacity='0'; setTimeout(()=>ld.hidden=true,700);
</script>
